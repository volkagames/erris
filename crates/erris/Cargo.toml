[package]
name = "erris"
version = "2.3.0"
edition = "2024"
rust-version = "1.86"
description = "Errors, explained."
license = "MIT OR Apache-2.0"
repository = "https://github.com/volkagames/erris"
readme = "../../README.md"
keywords = ["error", "diagnostics", "report", "trace"]
categories = ["rust-patterns", "development-tools::debugging"]

# docs.rs builds on nightly and passes `--cfg docsrs`, which also documents the
# `tracked` module without turning `erris::Result` into `TrackedResult`.
[package.metadata.docs.rs]
features = ["to_json", "serde_json_value", "backtrace"]

[features]
# `to_json` was a default up to 2.1. 2.2.0 dropped it, which broke builds that
# relied on it; it stays a default until the next major release.
default = ["spantrace", "to_json"]
spantrace = [
    "dep:tracing-core",
    "dep:tracing-error",
    "dep:tracing-subscriber",
    "dep:tracing",
    "erris-meta/spantrace",
]
backtrace = []
keep-duplicate-location = []
to_json = ["dep:serde_json", "dep:serde", "spantrace"]
serde_json_value = ["to_json"]
# Nightly only: needs `try_trait_v2`. Turns `erris::Result` into `TrackedResult`.
tracked = []
# Also exports the tracking `Result`, `Ok` and `Err` from `erris::prelude`.
tracked_prelude = ["tracked"]
# Deprecated, does nothing. 2.2.0 removed it, which broke dependency resolution
# for crates that named it; kept until the next major release.
valuable = []

[dependencies]
erris-meta = { version = "1", path = "../erris-meta" }
indenter = { version = "0.3", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-core = { version = "0.1", optional = true }
tracing-error = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }

[dev-dependencies]
erris-meta = { version = "1", path = "../erris-meta" }
rusty-fork = "0.3.1"
thiserror = "2.0.20"
tracing-log = "0.2"
